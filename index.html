<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="MrMagic.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600&display=swap" rel="stylesheet">
  <script src="auth-config.js"></script>
  <style>
    .back-btn{position:fixed;top:12px;left:12px;z-index:60;display:inline-block;background:#fafafa;border:1px solid #e5e5e5;padding:6px 10px;border-radius:6px;color:#111;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;min-width:74px;width:74px;text-align:center;box-shadow:none;font-family:'VCR_OSD_MONO', monospace;box-sizing:border-box}
    .back-btn:active{transform:translateY(1px)}
  </style>
</head>
<body>
  <script>sessionStorage.setItem('claudeSonnet45','enabled');</script>
  <a href="https://www.mrmagic.com.au/" class="back-btn" aria-label="Back to Mr Magic site">← Back</a>
  <main class="page">

  <!-- Card -->
    <section class="card" aria-label="Login">
      <header class="card__header">
        <h1 class="card__title">
          <span class="card__title--line1">MR MAGIC AUTOMATION</span>
        </h1>
        <p class="card__subtitle brand-subtitle">Australian Carwash Manufacturer</p>
      </header>

  <form class="form" action="#" method="post" novalidate autocomplete="off">
        <label class="field">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="10" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <div class="field__input-wrapper">
            <input class="field__input" id="password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required />
            <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
                <circle cx="12" cy="12" r="3"/>
                <line id="eyeSlash" x1="4" y1="4" x2="20" y2="20" />
              </svg>
            </button>
          </div>
          <span class="sr-only">Password</span>
        </label>

  <button class="button" type="submit">LOGIN</button>
  <div class="loading" id="loginLoading" hidden style="margin-top:8px;font-size:12px;color:#555">Authenticating…</div>

        <!-- Error message shown on incorrect credentials -->
        <p class="form__error" id="formError" role="alert" aria-live="assertive" hidden>Wrong password</p>
      </form>

      <script>
        (function(){
          const form = document.querySelector('.form');
          const err = document.getElementById('formError');
          const loading = document.getElementById('loginLoading');
          const passwordInput = document.getElementById('password');
          const togglePassword = document.getElementById('togglePassword');
          const eyeSlash = document.getElementById('eyeSlash');
          const cfg = window.MRMAGIC_AUTH || {};
          const AUTH_KEY = String(cfg.AUTH_KEY || 'authToken');
          const AUTH_VALUE = String(cfg.AUTH_VALUE || 'ok');
          const QR_ACCESS_TOKEN = String(cfg.QR_ACCESS_TOKEN || '');
          // Always use project-relative path so it works locally and online
          const redirectPath = String(cfg.REDIRECT_PATH || 'Homepage/homepage.html');
          const PASSWORDS = Array.isArray(cfg.PASSWORDS) && cfg.PASSWORDS.length ? cfg.PASSWORDS : ['magic','Magic'];

          function getHashParams(){
            const raw = (location.hash || '').replace(/^#/, '');
            return new URLSearchParams(raw);
          }

          function getQueryParams(){
            return new URLSearchParams(location.search || '');
          }

          function clearTokenFromUrl(){
            try {
              history.replaceState(null, '', location.pathname);
            } catch(e) {}
          }

          function setAuthAndRedirect(){
            sessionStorage.setItem(AUTH_KEY, AUTH_VALUE);
            try { localStorage.setItem(AUTH_KEY, AUTH_VALUE); } catch(e) {}
            sessionStorage.setItem('claudeSonnet45', 'enabled');
            window.location.href = redirectPath;
          }

          // Initial state: password hidden, plain eye (no slash)
          if (eyeSlash) {
            eyeSlash.style.display = 'none';
          }

          togglePassword.addEventListener('click', ()=>{
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            // eye with slash = visible, plain eye = hidden
            if (eyeSlash) {
              eyeSlash.style.display = isHidden ? 'block' : 'none';
            }
            togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
          });

          // Optional auto-login (QR deep link):
          // - Token mode (recommended): `?token=...` or `#token=...`
          // - Password mode: `?password=...&autologin=1` or `#password=...&autologin=1`
          (function tryAutoLogin(){
            const qp = getQueryParams();
            const hp = getHashParams();

            const rawHash = (location.hash || '').replace(/^#/, '').trim();
            const rawSearch = (location.search || '').replace(/^\?/, '').trim();
            const isKeyValue = (raw) => raw.includes('=');

            let token = (qp.get('t') || qp.get('token') || hp.get('t') || hp.get('token') || '').trim();
            // Some QR generators/scanners use a bare hash like `.../index.html#magic`
            if(!token && rawHash && !isKeyValue(rawHash)) token = rawHash;
            if(!token && rawSearch && !isKeyValue(rawSearch) && !rawSearch.includes('&')) token = rawSearch;

            // Token-based login (preferred)
            if(token && QR_ACCESS_TOKEN && token === QR_ACCESS_TOKEN){
              clearTokenFromUrl();
              setAuthAndRedirect();
              return;
            }

            // Fallback: if someone encoded the password into the token field, allow it.
            if(token && PASSWORDS.includes(token)){
              passwordInput.value = token;
              clearTokenFromUrl();
              try {
                if(typeof form.requestSubmit === 'function') form.requestSubmit();
                else form.dispatchEvent(new Event('submit', { cancelable: true }));
              } catch(e) {}
              return;
            }

            // Password-based login
            // If a password is explicitly provided, assume intent is to auto-login.
            let pw = (qp.get('p') || qp.get('pw') || qp.get('password') || hp.get('p') || hp.get('pw') || hp.get('password') || '').trim();
            if(!pw && rawHash && !isKeyValue(rawHash)) pw = rawHash;
            if(!pw && rawSearch && !isKeyValue(rawSearch) && !rawSearch.includes('&')) pw = rawSearch;
            if(!pw) {
              // Keep backwards-compat: require explicit flag if no password provided.
              const auto = (qp.get('autologin') || hp.get('autologin') || '').trim();
              if(auto !== '1' && auto.toLowerCase() !== 'true') return;
              return;
            }

            passwordInput.value = pw;
            clearTokenFromUrl();
            // Trigger existing submit handler
            try {
              if(typeof form.requestSubmit === 'function') form.requestSubmit();
              else form.dispatchEvent(new Event('submit', { cancelable: true }));
            } catch(e) {}
          })();

          form.addEventListener('submit', (e)=>{
            e.preventDefault();
            err.hidden = true;
            err.textContent = '';
            err.classList.remove('is-visible');
            loading.hidden = false;

            const password = passwordInput.value.trim();
            if (!password) {
              err.hidden = false;
              err.textContent = 'Enter password';
              loading.hidden = true;
              return;
            }

            if (PASSWORDS.includes(password)) {
              setAuthAndRedirect();
            } else {
              err.hidden = false;
              err.classList.add('is-visible');
              err.textContent = 'Wrong password';
            }

            loading.hidden = true;
          });
        })();
      </script>
    </section>
  </main>
</body>
</html>
