<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storm Operators Manual</title>
  <style>
    @font-face{
      font-family:'VCR OSD Mono';
      src:url('../Assets/VCR_OSD_MONO_1.001.ttf') format('truetype');
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    body{margin:0;font-family:'VCR OSD Mono', monospace;background:#fafafa;color:#111}
    .back-btn{position:fixed;top:12px;left:12px;z-index:60;display:inline-block;background:#fafafa;border:1px solid #e5e5e5;padding:6px 10px;border-radius:6px;color:#111;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;min-width:74px;width:74px;text-align:center;box-shadow:none;font-family:'VCR OSD Mono', monospace;box-sizing:border-box}
    .back-btn:active{transform:translateY(1px)}
    .manual-viewer{max-width:1200px;margin:80px auto 60px;padding:0 24px}
    .manual-viewer__title{margin:0 0 14px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:.5px;text-align:center}
    .manual-viewer__frame{border:none;border-radius:0;box-shadow:none;background:transparent}
    .manual-viewer__frame object{display:block;width:100%;height:1500px}
    /* pdf.js page canvas styling (preserve natural aspect ratio) */
    #pdfPages{padding:16px 0;}
    #pdfPages canvas{display:block;margin:0 0 24px;max-width:100%;background:#fff;border:none;border-radius:0;box-shadow:none}
    #pdfPages img{display:block;margin:0 0 24px;max-width:100%;height:auto;border:1px solid #e5e5e5;border-radius:2px;box-shadow:none}
    .manual-layout{display:flex;gap:16px;align-items:flex-start}
    .thumbs{flex:0 0 140px;width:140px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;border:1px solid #eee;border-radius:8px;background:#fff;padding:8px}
    .thumbs h3{margin:0 0 8px;font-size:12px;font-weight:600;color:#444}
    .thumbs img{display:block;width:100%;height:auto;margin:0 0 8px;border:1px solid #ddd;border-radius:4px;cursor:pointer}
    .thumbs img.active{outline:none;border-color:transparent}
    .manual-content{flex:1;min-width:0}
    @media (max-width: 900px){ .manual-layout{display:block} .thumbs{display:none} }
    /* Removed interactive PDF controls */
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width: 900px){ .manual-viewer__frame object{height:1100px} }
    /* Mobile: turn frame into scroll container with full viewport height for thumb scrolling */
    @media (max-width: 600px){
      .manual-viewer__frame{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
      .manual-viewer__frame object{height:100%;min-height:920px;}
    }
  </style>
</head>
<body>
  <script>sessionStorage.setItem('claudeSonnet45','enabled');</script>
  <script>(function(){const t=sessionStorage.getItem('authToken');if(!t){window.location.href='../Portal%20Page/MrMagic.html';}})();</script>
  <a class="back-btn" href="../Homepage/homepage.html" aria-label="Back to manuals index">← Back</a>
  <section class="manual-viewer" aria-label="Storm Operators Manual">
    <h2 class="manual-viewer__title">Storm</h2>
    <div class="manual-viewer__frame">
      <div class="manual-layout">
        <nav id="thumbStrip" class="thumbs" aria-label="Page thumbnails"></nav>
        <div class="manual-content">
          <div id="pdfPages" aria-label="Storm manual full pages" style="display:none;"></div>
          <div id="pdfLoading" style="display:none;text-align:center;padding:32px 0;">
            <div style="display:inline-block;width:42px;height:42px;border:4px solid #d2d2d2;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;"></div>
          </div>
        </div>
      </div>
    </div>
      <script>
        (function(){
          const pagesContainer = document.getElementById('pdfPages');
          const loadingEl = document.getElementById('pdfLoading');
          const frame = document.querySelector('.manual-viewer__frame');
          const thumbStrip = document.getElementById('thumbStrip');
          // Show container and loader
          pagesContainer.style.display = 'block';
          loadingEl.style.display = 'block';
          // Build list of image paths from the Storm Manual folder
          const total = 79; // images numbered 0..78 inclusive
          const basePath = 'Storm Manual/STORM OPERATORS MANUAL 37-images-';
          const imgs = [];
          for(let i=0;i<total;i++) imgs.push(basePath + i + '.jpg');
          // Build thumbnail strip
          const thumbs = [];
          for(let ti=0;ti<total;ti++){
            const t = new Image();
            t.src = imgs[ti];
            t.alt = 'Page ' + (ti+1);
            t.dataset.index = String(ti);
            t.addEventListener('click', ()=>{
              const idx = parseInt(t.dataset.index,10);
              const target = document.getElementById('page-'+(idx+1));
              if(target){ target.scrollIntoView({behavior:'smooth', block:'start'}); setActiveThumb(idx); }
            });
            thumbs.push(t);
            thumbStrip.appendChild(t);
          }
          function setActiveThumb(idx){
            thumbs.forEach((el,i)=>{ if(i===idx) el.classList.add('active'); else el.classList.remove('active'); });
            if(thumbs[idx]){
              try{ thumbs[idx].scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'}); }catch(e){}
            }
          }
          // Append images sequentially
          const mainImgs = new Array(total);
          let i = 0;
          function appendNext(){
            if(i >= imgs.length){ loadingEl.style.display='none'; return; }
            const src = imgs[i];
            const img = new Image();
            img.alt = 'Storm manual page ' + (i+1);
            img.id = 'page-' + (i+1);
            img.style.display='block';
            img.style.margin='0 0 24px';
            img.style.maxWidth='100%';
            img.onload = function(){ pagesContainer.appendChild(img); mainImgs[i]=img; setActiveThumb(i); i++; requestAnimationFrame(appendNext); };
            img.onerror = function(){ console.warn('[IMG] Missing image', src); i++; requestAnimationFrame(appendNext); };
            img.src = src;
          }
          appendNext();
          // Highlight current page in thumbnail strip as user scrolls
          const io = new IntersectionObserver((entries)=>{
            let bestIdx = null; let bestRatio = 0;
            entries.forEach(e=>{
              if(e.isIntersecting && e.intersectionRatio > bestRatio){
                bestRatio = e.intersectionRatio;
                const id = e.target.id; // page-X
                const idx = parseInt(id.split('-')[1],10)-1;
                bestIdx = idx;
              }
            });
            if(bestIdx!=null) setActiveThumb(bestIdx);
          },{root:null, threshold:[0.2,0.4,0.6,0.8]});
          const observeTimer = setInterval(()=>{
            for(let k=0;k<mainImgs.length;k++){
              const el = mainImgs[k];
              if(el && !el._observed){ io.observe(el); el._observed = true; }
            }
            if(mainImgs.every(el=>!!el)){ clearInterval(observeTimer); }
          }, 300);
        })();
      </script>
  </section>
</body>
</html>
