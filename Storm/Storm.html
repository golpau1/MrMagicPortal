<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storm Operators Manual</title>
  <style>
    @font-face{
      font-family:'VCR OSD Mono';
      src:url('../Assets/VCR_OSD_MONO_1.001.ttf') format('truetype');
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    body{margin:0;font-family:'VCR OSD Mono', monospace;background:#fafafa;color:#111}
    .back-btn{position:fixed;top:12px;left:12px;z-index:60;display:inline-block;background:#fafafa;border:1px solid #e5e5e5;padding:6px 10px;border-radius:6px;color:#111;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;min-width:74px;width:74px;text-align:center;box-shadow:none;font-family:'VCR OSD Mono', monospace;box-sizing:border-box}
    .back-btn:active{transform:translateY(1px)}
    .manual-viewer{max-width:1200px;margin:80px auto 60px;padding:0 24px}
    .manual-viewer__title{margin:0 0 14px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:.5px;text-align:center}
    .manual-viewer__frame{border:none;border-radius:0;box-shadow:none;background:transparent}
    .manual-viewer__frame object{display:block;width:100%;height:1500px}
    /* Image stack container */
    #pdfPages{padding:16px 0; display:flex; flex-direction:column; align-items:center;}
    /* Subtle page number */
    .page-item{position:relative; width:67%; max-width:900px;}
    .page-number{position:absolute; top:6px; left:-28px; font-size:12px; color:#555; padding:0; border:none; background:transparent;}
    #pdfPages canvas{display:block;margin:0 0 24px;max-width:100%;background:#fff;border:none;border-radius:0;box-shadow:none}
    #pdfPages img{display:block;margin:0 0 24px;width:67%;max-width:900px;height:auto;border:1px solid #e5e5e5;border-radius:2px;box-shadow:none}
    /* Zoom controls removed */
    /* Removed interactive PDF controls */
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width: 900px){ .manual-viewer__frame object{height:1100px} }
    /* Mobile: turn frame into scroll container with full viewport height for thumb scrolling */
    @media (max-width: 600px){
      .manual-viewer__frame{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
      .manual-viewer__frame object{height:100%;min-height:920px;}
      /* Mobile: ensure vertical stack and full-width pages */
      #pdfPages{display:block;padding:16px 0;}
      #pdfPages img{width:100%;max-width:100%;margin:0 auto 16px;}
    }
  </style>
</head>
<body>
  <script>sessionStorage.setItem('claudeSonnet45','enabled');</script>
  <script>(function(){const t=sessionStorage.getItem('authToken');if(!t){window.location.href='../Portal%20Page/MrMagic.html';}})();</script>
  <a class="back-btn" href="../Homepage/homepage.html" aria-label="Back to manuals index">← Back</a>
  <div class="page-controls" aria-label="Page selector" style="position:fixed;top:12px;right:12px;z-index:70;background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:center">
    <span style="font-size:13px;font-weight:600">Page</span>
    <select id="pageSelect" title="Select page" aria-label="Select page" style="font-family:'VCR OSD Mono', monospace;background:#fff;border:1px solid #d2d2d2;border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;min-width:74px;cursor:pointer"></select>
  </div>
  
  <section class="manual-viewer" aria-label="Storm Operators Manual">
    <div class="manual-viewer__frame">
      <div id="pdfPages" aria-label="Storm manual full pages" style="display:none;"></div>
      <div id="pdfLoading" style="display:none;text-align:center;padding:32px 0;">
        <div style="display:inline-block;width:42px;height:42px;border:4px solid #d2d2d2;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
    </div>
      <script>
        (function(){
          const pagesContainer = document.getElementById('pdfPages');
          const loadingEl = document.getElementById('pdfLoading');
          const frame = document.querySelector('.manual-viewer__frame');
          const pageSelect = document.getElementById('pageSelect');
          // Show container and loader (use flex so align-items:center works)
          pagesContainer.style.display = 'flex';
          loadingEl.style.display = 'block';
          // Build list of image paths from the Storm Manual folder
          const total = 79; // images numbered 0..78 inclusive
          const basePath = 'Storm Manual/STORM OPERATORS MANUAL 37-images-';
          const imgs = [];
          for(let i=0;i<total;i++) imgs.push(basePath + i + '.jpg');
          // Populate page selector 1..total
          (function(){
            const frag = document.createDocumentFragment();
            for(let p=1;p<=total;p++){
              const opt = document.createElement('option');
              opt.value = String(p);
              opt.textContent = String(p);
              frag.appendChild(opt);
            }
            pageSelect.appendChild(frag);
          })();
          // Smooth mobile loading: lazy load and batch append
          let i = 0;
          const imgEls = [];
          let pendingIndex = null;
          const isMobile = window.matchMedia('(max-width: 600px)').matches;
          const fragBatchSize = isMobile ? 4 : 8; // smaller batches on mobile
          function createWrapper(idx, img){
            const wrapper = document.createElement('div');
            wrapper.className = 'page-item';
            const label = document.createElement('span');
            label.className = 'page-number';
            label.textContent = String(idx+1);
            wrapper.appendChild(img);
            wrapper.appendChild(label);
            return wrapper;
          }
          function appendBatch(){
            if(i >= imgs.length){ loadingEl.style.display='none'; return; }
            const frag = document.createDocumentFragment();
            let count = 0;
            while(i < imgs.length && count < fragBatchSize){
              const src = imgs[i];
              const img = new Image();
              img.alt = 'Storm manual page ' + (i+1);
              img.loading = 'lazy';
              img.decoding = 'async';
              img.style.display='block';
              img.style.margin='0 0 24px';
              img.onload = (function(idx){
                return function(){
                  imgEls[idx] = img;
                  if(pendingIndex !== null && pendingIndex === idx){
                    const el = imgEls[pendingIndex];
                    if(el){ el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'}); }
                    pendingIndex = null;
                  }
                };
              })(i);
              img.onerror = function(){ console.warn('[IMG] Missing image', src); };
              img.src = src;
              frag.appendChild(createWrapper(i, img));
              i++; count++;
            }
            pagesContainer.appendChild(frag);
            if(i < imgs.length){
              if('requestIdleCallback' in window){
                requestIdleCallback(()=> requestAnimationFrame(appendBatch));
              } else {
                setTimeout(()=> requestAnimationFrame(appendBatch), 30);
              }
            } else {
              loadingEl.style.display='none';
            }
          }
          appendBatch();
          // Handle page selection changes
          pageSelect.addEventListener('change', ()=>{
            const idx = Math.max(0, Math.min(total-1, parseInt(pageSelect.value,10)-1));
            const el = imgEls[idx];
            if(el){
              el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'});
            } else {
              pendingIndex = idx; // will scroll once that image is loaded
              loadingEl.style.display = 'block';
            }
          });
          // Helper: center horizontally if content wider than viewport
          function centerHorizontally(){
            const sw = pagesContainer.scrollWidth;
            const cw = pagesContainer.clientWidth;
            pagesContainer.scrollLeft = sw > cw ? Math.max(0, (sw - cw) / 2) : 0;
          }
          // Re-center on resize to avoid drift when viewport changes
          let resizeTO;
          window.addEventListener('resize', ()=>{
            clearTimeout(resizeTO);
            resizeTO = setTimeout(()=>{
              requestAnimationFrame(centerHorizontally);
            }, 80);
          });
          // Center once when the first image is loaded
          const observer = new MutationObserver((mutations)=>{
            for(const m of mutations){
              for(const n of m.addedNodes){
                if(n.tagName === 'IMG'){
                  // First image: center to start
                  if(pagesContainer.querySelectorAll('img').length === 1){
                    requestAnimationFrame(centerHorizontally);
                  }
                }
              }
            }
          });
          observer.observe(pagesContainer, {childList:true});
          // No zoom or thumbnail viewer — simple stacked images only
        })();
      </script>
  </section>
</body>
</html>
