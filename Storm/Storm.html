<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storm Operators Manual</title>
  <style>
    @font-face{
      font-family:'VCR OSD Mono';
      src:url('../Assets/VCR_OSD_MONO_1.001.ttf') format('truetype');
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    body{margin:0;font-family:'VCR OSD Mono', monospace;background:#fafafa;color:#111}
    .back-btn{position:fixed;top:12px;left:12px;z-index:60;display:inline-block;background:#fafafa;border:1px solid #e5e5e5;padding:6px 10px;border-radius:6px;color:#111;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;min-width:74px;width:74px;text-align:center;box-shadow:none;font-family:'VCR OSD Mono', monospace;box-sizing:border-box}
    .back-btn:active{transform:translateY(1px)}
    .manual-viewer{max-width:1200px;margin:80px auto 60px;padding:0}
    .manual-viewer__title{margin:0 0 14px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:.5px;text-align:center}
    .manual-viewer__frame{border:none;border-radius:0;box-shadow:none;background:transparent}
    /* Image stack container */
    #pdfPages{padding:16px 0; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%;}
    /* Subtle page number */
    .page-item{position:relative; width:67%; max-width:900px; margin:0 auto; scroll-margin-top:72px}
    .page-number{position:absolute; top:6px; left:-24px; font-size:12px; color:#555; padding:0; border:none; background:transparent; pointer-events:none;}
    #pdfPages canvas{display:block;margin:0 0 24px;max-width:100%;background:#fff;border:none;border-radius:0;box-shadow:none}
    #pdfPages img{display:block;margin:0 0 24px;width:100%;max-width:900px;height:auto;border:1px solid #e5e5e5;border-radius:2px;box-shadow:none}
    
    @keyframes spin{to{transform:rotate(360deg)}}
    
    /* Mobile: turn frame into scroll container with full viewport height for thumb scrolling */
    @media (max-width: 600px){
      .manual-viewer__frame{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
      /* Mobile: ensure vertical stack and full-width pages */
      #pdfPages{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 0;width:100%;}
      .page-item{width:100%;max-width:900px;margin:0 auto;}
      #pdfPages img{width:100%;max-width:900px;margin:0 0 16px;}
    }
  </style>
</head>
<body>
  <script>sessionStorage.setItem('claudeSonnet45','enabled');</script>
  <script>(function(){const t=sessionStorage.getItem('authToken');if(!t){window.location.href='../Portal%20Page/MrMagic.html';}})();</script>
  <a class="back-btn" href="../Homepage/homepage.html" aria-label="Back to manuals index">← Back</a>
  <div class="page-controls" aria-label="Page selector" style="position:fixed;top:12px;right:12px;z-index:70;background:#fafafa;border:1px solid #e5e5e5;border-radius:6px;padding:6px 10px;display:flex;gap:8px;align-items:center;cursor:pointer;box-sizing:border-box">
    <span style="font-size:14px;font-weight:700">Page</span>
    <button id="pageButton" title="Select page" aria-haspopup="listbox" aria-expanded="false"
      style="font-family:'VCR OSD Mono', monospace;background:transparent;border:none;border-radius:0;padding:0;font-size:14px;font-weight:700;min-width:auto;cursor:pointer;display:flex;align-items:center;gap:6px">
      <span id="pageButtonNumber">1</span>
      <span aria-hidden="true" id="pageButtonIcon">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </button>
    <div id="pageMenu" role="listbox" aria-label="Pages" style="display:none;position:absolute;top:42px;right:6px;background:#fafafa;border:1px solid #e5e5e5;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,0.12);max-height:420px;overflow:auto;min-width:220px;-webkit-tap-highlight-color: transparent">
    </div>
  </div>
  
  <section class="manual-viewer" aria-label="Storm Operators Manual">
    <div class="manual-viewer__frame">
      <div id="pdfPages" aria-label="Storm manual full pages" style="display:none;"></div>
      <div id="pdfLoading" style="display:none;text-align:center;padding:32px 0;">
        <div style="display:inline-block;width:42px;height:42px;border:4px solid #d2d2d2;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
    </div>
      <script>
        (function(){
          const pagesContainer = document.getElementById('pdfPages');
          const loadingEl = document.getElementById('pdfLoading');
          const frame = document.querySelector('.manual-viewer__frame');
          const pageButton = document.getElementById('pageButton');
          const pageMenu = document.getElementById('pageMenu');
          const pageButtonNumber = document.getElementById('pageButtonNumber');
          const pageButtonIcon = document.getElementById('pageButtonIcon');
          const pageControls = document.querySelector('.page-controls');
          // Show container and loader (use flex so align-items:center works)
          pagesContainer.style.display = 'flex';
          loadingEl.style.display = 'block';
          // Build list of image paths from the Storm Manual folder
          const total = 79; // images numbered 0..78 inclusive
          const basePath = 'Storm Manual/STORM OPERATORS MANUAL 37-images-';
          const imgs = [];
          for(let i=0;i<total;i++) imgs.push(basePath + i + '.jpg');
          // Populate page selector with titles where provided
          const titles = {
              2: 'Contents',
              5: 'Maintenance',
              6: 'Storm Spare Parts',
              7: 'Tips',
              8: 'Pressure Settings',
              9: 'Pressure Settings',
              10: 'Pressure Settings',
              11: 'ReBoot',
              12: 'Machine / Wash Failure',
              13: 'Gantry Reposition',
              14: 'Filters',
              15: 'Air Filters',
              16: 'Fan Filter Clean',
              17: 'Belt Adjustment',
              18: 'High Pressure Pump Oil Change',
              19: 'Under body Valve Lubrication',
              20: 'Changeover Valve Lubrication',
              21: 'Grease Boom Swivels',
              22: 'Grease Undercarriage Bearings',
              23: 'Tractor Feed Lubrication',
              24: 'Blower Parts Lubrication',
              25: 'Clean Gantry Photo Eyes',
              26: 'Wax Solenoid',
              27: 'Boom Dump Valve',
              28: 'Boom Dump Valve',
              29: '3/4" High Pressure Check Valve',
              30: 'Mars Note Validator',
              31: 'Mars Note Validator Fault Codes',
              32: 'Coin Validator Removal',
              33: 'Coin Validator Cleaning',
              34: 'Coin Validator',
              35: 'Coin Validator',
              36: 'Power Supply 240Vac Removal',
              37: 'Sensors',
              38: 'Sensors Beam Home & Beam End',
              39: 'Sensors',
              40: 'Sensors Y Home & Y End',
              41: 'Sensors',
              42: 'Sensors Z Home',
              43: 'Sensors Boom Light',
              44: 'Sensors Underbody Test',
              45: 'Sensors Underbody Test (Water In Line)',
              46: 'Sensors Underbody Test (Switch Adjustment)',
              47: 'Electronics',
              48: 'Electronics',
              49: 'Electronics',
              50: 'Safety Timer',
              51: 'Safety Timer (Omron)',
              52: 'Cabinet Wiring Connections',
              53: 'Cabinet Wiring Connections',
              54: 'Cabinet Wiring Connections',
              55: 'Gantry Wiring Connections',
              56: 'Gantry Wiring Connections',
              57: 'Fault Procedures',
              58: 'Jet Cleaning',
              59: 'Product Venturi’s',
              60: 'Product Metering Settings',
              61: 'Product Tip Settings Standard',
              62: 'Product Tip Settings',
              63: 'Gantry Jet Location & Sizes',
              64: 'Boom Turbo Sizes',
              65: 'Boom Presoak Jet Sizes',
              66: 'Boom Presoak Top Jet Sizes',
              67: 'Wash Jet Sizes',
              68: 'Inverter Settings',
              69: 'Inverter Settings',
              70: 'Menu Explanation',
              71: 'Menu Explanation',
              72: 'Menu Explanation',
              73: 'Sensor Test',
              74: 'Sensor Test',
              75: 'Sensor Test (Example)',
              76: 'Return to Wash Cars from Sensor Test',
              77: 'Boom Position Adjustment at GROUND',
              78: 'Boom Position Adjustment at GROUND',
              79: 'Boom Position Adjustment at GROUND'
            };
          (function buildMenu(){
            const frag = document.createDocumentFragment();
            for(let p=1;p<=total;p++){
              const item = document.createElement('button');
              item.type = 'button';
              item.role = 'option';
              item.setAttribute('data-page', String(p));
              item.style.cssText = "display:block;width:100%;text-align:left;padding:8px 10px;background:#fafafa;border:none;border-bottom:1px solid #eee;font-family:'VCR OSD Mono', monospace;font-size:13px;cursor:pointer;outline:none;-webkit-appearance:none;-moz-appearance:none;color:#111";
              const title = titles[p];
              item.textContent = title ? `${p} – ${title}` : String(p);
              item.addEventListener('click', ()=>{
                pageButtonNumber.textContent = String(p);
                pageButton.setAttribute('aria-expanded','false');
                pageMenu.style.display = 'none';
                // set icon to down when closed
                pageButtonIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
                const idx = p - 1;
                loadUntil(idx);
              });
              frag.appendChild(item);
            }
            pageMenu.appendChild(frag);
          })();
          // Smooth mobile loading: lazy load and batch append
          let i = 0;
          const imgEls = [];
          const wrapperEls = [];
          let pendingIndex = null;
          const isMobile = window.matchMedia('(max-width: 600px)').matches;
          let fragBatchSize = isMobile ? 4 : 8; // smaller batches on mobile
          function createWrapper(idx, img){
            const wrapper = document.createElement('div');
            wrapper.className = 'page-item';
            const label = document.createElement('span');
            label.className = 'page-number';
            label.textContent = String(idx+1);
            wrapper.appendChild(img);
            wrapper.appendChild(label);
            wrapperEls[idx] = wrapper;
            return wrapper;
          }
          let fastForwardTarget = null;
          function appendBatch(){
            if(i >= imgs.length){ loadingEl.style.display='none'; return; }
            const frag = document.createDocumentFragment();
            let count = 0;
            while(i < imgs.length && count < fragBatchSize){
              const src = imgs[i];
              const img = new Image();
              img.alt = 'Storm manual page ' + (i+1);
              img.loading = 'lazy';
              img.decoding = 'async';
              img.style.display='block';
              img.style.margin='0 0 24px';
              img.onload = (function(idx){
                return function(){
                  imgEls[idx] = img;
                  if(pendingIndex !== null && pendingIndex === idx){
                    const el = wrapperEls[pendingIndex] || imgEls[pendingIndex];
                    if(el){
                      requestAnimationFrame(()=>{
                        requestAnimationFrame(()=>{
                          el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'});
                        });
                      });
                    }
                    pendingIndex = null;
                  }
                };
              })(i);
              img.onerror = function(){ console.warn('[IMG] Missing image', src); };
              img.src = src;
              frag.appendChild(createWrapper(i, img));
              i++; count++;
            }
            pagesContainer.appendChild(frag);
            if(fastForwardTarget !== null && (wrapperEls[fastForwardTarget] || imgEls[fastForwardTarget])){
              const el = wrapperEls[fastForwardTarget] || imgEls[fastForwardTarget];
              if(el){
                requestAnimationFrame(()=>{
                  requestAnimationFrame(()=>{
                    el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'});
                  });
                });
              }
              fastForwardTarget = null;
              loadingEl.style.display='none';
            }
            if(i < imgs.length){
              if('requestIdleCallback' in window && fastForwardTarget === null){
                requestIdleCallback(()=> requestAnimationFrame(appendBatch));
              } else {
                setTimeout(()=> requestAnimationFrame(appendBatch), fastForwardTarget === null ? 30 : 0);
              }
            } else {
              loadingEl.style.display='none';
            }
          }
          appendBatch();
          // Handle page selection changes
          function loadUntil(targetIdx){
            const existingWrapper = wrapperEls[targetIdx];
            const existingImg = imgEls[targetIdx];
            if(existingWrapper || existingImg){
              const el = existingWrapper || existingImg;
              requestAnimationFrame(()=>{
                requestAnimationFrame(()=>{
                  el.scrollIntoView({behavior:'smooth',block:'start',inline:'nearest'});
                });
              });
              return;
            }
            // Increase batch size temporarily to reach the target faster
            const originalBatch = fragBatchSize;
            fragBatchSize = Math.max(fragBatchSize, 12);
            fastForwardTarget = targetIdx;
            pendingIndex = targetIdx;
            loadingEl.style.display = 'block';
            // Kick the appender quickly until the target is available
            setTimeout(()=> requestAnimationFrame(appendBatch), 0);
            // Restore batch size after some time
            setTimeout(()=>{ fragBatchSize = originalBatch; }, 1500);
          }
          // Toggle menu
          function toggleMenu(force){
            const expanded = pageButton.getAttribute('aria-expanded') === 'true';
            const open = force === true || (!expanded && force !== false);
            if(open){
              pageButton.setAttribute('aria-expanded','true');
              pageMenu.style.display = 'block';
              // set icon to up
              pageButtonIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 15 12 9 18 15"/></svg>';
            } else {
              pageButton.setAttribute('aria-expanded','false');
              pageMenu.style.display = 'none';
              // set icon to down
              pageButtonIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
            }
          }
          // Open/close when clicking anywhere in the page-controls container
          pageControls.addEventListener('click', (e)=>{
            if(pageMenu.contains(e.target)) return; // ignore clicks inside menu
            toggleMenu();
          });
          // Keep button click working too
          pageButton.addEventListener('click', (e)=>{
            if(pageMenu.contains(e.target)) return;
            const expanded = pageButton.getAttribute('aria-expanded') === 'true';
            toggleMenu(!expanded);
          });
          // Ensure clicks on number or arrow also toggle
          pageButtonNumber.addEventListener('click', (e)=>{
            e.stopPropagation();
            const expanded = pageButton.getAttribute('aria-expanded') === 'true';
            toggleMenu(!expanded);
          });
          pageButtonIcon.addEventListener('click', (e)=>{
            e.stopPropagation();
            const expanded = pageButton.getAttribute('aria-expanded') === 'true';
            toggleMenu(!expanded);
          });
          // Close menu on outside click
          document.addEventListener('click', (e)=>{
            if(!pageMenu.contains(e.target) && e.target !== pageButton && !pageControls.contains(e.target)){
              pageButton.setAttribute('aria-expanded','false');
              pageMenu.style.display = 'none';
              // set icon to down when closed
              pageButtonIcon.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
            }
          });
          // No horizontal centering helper needed; flex layout centers content.
          // No zoom or thumbnail viewer — simple stacked images only
        })();
      </script>
      <style>
        /* Subtle scrollbar styling */
        #pageMenu::-webkit-scrollbar{width:8px;height:8px}
        #pageMenu::-webkit-scrollbar-track{background:#f4f4f4;border-radius:6px}
        #pageMenu::-webkit-scrollbar-thumb{background:#c8c8c8;border-radius:6px;border:1px solid #e5e5e5}
        #pageMenu{-webkit-overflow-scrolling:touch}
        /* Mobile: remove blue highlight/outline */
        .page-controls, .page-controls *{ -webkit-tap-highlight-color: transparent; }
        #pageMenu button:focus{ outline:none; background:#f0f0f0; }
      </style>
  </section>
</body>
</html>
