<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Wash Operator Manual</title>
  <style>
    @font-face{
      font-family:'VCR OSD Mono';
      src:url('../Assets/VCR_OSD_MONO_1.001.ttf') format('truetype');
      font-weight:normal;
      font-style:normal;
      font-display:swap;
    }
    body{margin:0;font-family:'VCR OSD Mono', monospace;background:#fafafa;color:#111}
    .back-btn{position:fixed;top:12px;left:12px;z-index:60;display:inline-block;background:#fafafa;border:1px solid #e5e5e5;padding:6px 10px;border-radius:6px;color:#111;text-decoration:none;font-weight:600;font-size:14px;line-height:1.2;min-width:74px;width:74px;text-align:center;box-shadow:none;font-family:'VCR OSD Mono', monospace;box-sizing:border-box}
    .back-btn:active{transform:translateY(1px)}
    .manual-viewer{max-width:1200px;margin:80px auto 60px;padding:0 24px}
    .manual-viewer__title{margin:0 0 14px;font-size:22px;line-height:1.3;font-weight:600;letter-spacing:.5px;text-align:center}
    .manual-viewer__frame{border:none;border-radius:0;box-shadow:none;background:transparent}
    /* Centered image stack (desktop 67%, mobile 100%) */
    #pdfPages{padding:16px 0; display:flex; flex-direction:column; align-items:center;}
    #pdfPages img{display:block;margin:0 0 24px;width:67%;max-width:900px;height:auto;border:1px solid #e5e5e5;border-radius:2px;box-shadow:none}
    /* Removed interactive PDF controls */
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (max-width: 600px){
      .manual-viewer__frame{height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
      /* Mobile: vertical stack full width */
      #pdfPages{display:block;padding:16px 0;}
      #pdfPages img{width:100%;max-width:100%;margin:0 auto 16px;}
    }
  </style>
</head>
<body>
  <script>sessionStorage.setItem('claudeSonnet45','enabled');</script>
  <script>(function(){const t=sessionStorage.getItem('authToken');if(!t){window.location.href='../index.html';}})();</script>
  <a class="back-btn" href="../Homepage/homepage.html" aria-label="Back to manuals index">← Back</a>
  <div class="page-controls" aria-label="Page and download controls" style="position:fixed;top:12px;right:12px;z-index:70;background:#fafafa;border:1px solid #e5e5e5;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
    <div style="display:flex;gap:8px;align-items:center">
      <span style="font-size:13px;font-weight:600">Page</span>
      <select id="pageSelect" title="Select page" aria-label="Select page" style="font-family:'VCR OSD Mono', monospace;background:#fff;border:1px solid #d2d2d2;border-radius:6px;padding:6px 8px;font-size:13px;font-weight:600;min-width:74px;cursor:pointer"></select>
    </div>
    <a href="../Assets/Smart%20Wash%20Operator%20Manual.pdf" download class="download-btn" title="Download PDF" aria-label="Download Smart Wash PDF"
       style="display:inline-block;background:#fff;border:1px solid #d2d2d2;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;color:#111;text-decoration:none;">
      Download PDF
    </a>
  </div>
  <section class="manual-viewer" aria-label="Smart Wash Operator Manual">
    <h2 class="manual-viewer__title">Smart Wash</h2>
    <div class="manual-viewer__frame">
      <div id="pdfPages" aria-label="Smart Wash manual full pages" style="display:none;"></div>
      <div id="pdfLoading" style="display:none;text-align:center;padding:32px 0;">
        <div style="display:inline-block;width:42px;height:42px;border:4px solid #d2d2d2;border-top-color:#111;border-radius:50%;animation:spin 1s linear infinite;"></div>
      </div>
    </div>
    <script>
      (function(){
        const pagesContainer = document.getElementById('pdfPages');
        const loadingEl = document.getElementById('pdfLoading');
        const pageSelect = document.getElementById('pageSelect');
        // Show container and loader (use flex for centered stack)
        pagesContainer.style.display = 'flex';
        loadingEl.style.display = 'block';
        // Folder provided by you
        const folder = 'Smart Wash Manual/';
        // Try to auto-detect naming pattern by probing a few common prefixes/suffixes
        const prefixes = [
          'Smart Wash Operator Manual-images-',
          'SMART WASH OPERATORS MANUAL-images-',
          'SMARTWASH-images-',
          'SMART WASH-',
          'SmartWash-',
          'page-',
          'image-',
          ''
        ];
        const suffixes = ['.jpg','.jpeg','.png'];
        function probePattern(idx, onFound, onFail){
          if(idx >= prefixes.length * suffixes.length) return onFail();
          const p = Math.floor(idx / suffixes.length);
          const s = idx % suffixes.length;
          const src = folder + prefixes[p] + 0 + suffixes[s];
          const testImg = new Image();
          testImg.onload = ()=> onFound(prefixes[p], suffixes[s]);
          testImg.onerror = ()=> probePattern(idx+1, onFound, onFail);
          testImg.src = src;
        }
        function streamImages(prefix, suffix){
          let i = 0; let successes = 0; let misses = 0;
          const MAX_MISSES = 1; // stop at first miss after at least one success
          const imgEls = [];
          (function appendNext(){
            const src = folder + prefix + i + suffix;
            const img = new Image();
            img.alt = 'Smart Wash manual page ' + (i+1);
            img.onload = function(){
              pagesContainer.appendChild(img);
              imgEls.push(img);
              successes++; i++; misses = 0; requestAnimationFrame(appendNext);
            };
            img.onerror = function(){
              misses++;
              if(successes > 0 && misses >= MAX_MISSES){ loadingEl.style.display='none'; return; }
              if(successes === 0 && i < 2){ i++; requestAnimationFrame(appendNext); return; }
              loadingEl.style.display='none';
            };
            img.src = src;
          })();
          // Populate page selector once we’ve loaded at least the first image
          const buildSelect = ()=>{
            const count = imgEls.length;
            if(count === 0) return;
            const frag = document.createDocumentFragment();
            for(let p=1;p<=count;p++){
              const opt = document.createElement('option');
              opt.value = String(p);
              opt.textContent = String(p);
              frag.appendChild(opt);
            }
            pageSelect.innerHTML = '';
            pageSelect.appendChild(frag);
          };
          const observer = new MutationObserver(()=>{ buildSelect(); });
          observer.observe(pagesContainer, {childList:true});
          pageSelect.addEventListener('change', ()=>{
            const idx = Math.max(0, Math.min(imgEls.length-1, parseInt(pageSelect.value,10)-1));
            const el = imgEls[idx];
            if(el){ el.scrollIntoView({behavior:'smooth',block:'start'}); }
          });
        }
        probePattern(0, (prefix, suffix)=>{
          streamImages(prefix, suffix);
        }, ()=>{
          loadingEl.innerHTML = '<div style="color:#666;font-size:14px">Add your image names in code: set prefix/suffix in Smartwash.html</div>';
          setTimeout(()=> loadingEl.style.display='none', 2500);
        });
      })();
    </script>
  </section>
</body>
</html>
